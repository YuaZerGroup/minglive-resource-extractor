include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Keep generated manifests out of the way of analysis.
    unused_import: warning
    dead_code: warning

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_fields
    - unnecessary_this
    - avoid_empty_else
    - avoid_relative_lib_imports
    - cancel_subscriptions
    - close_sinks
