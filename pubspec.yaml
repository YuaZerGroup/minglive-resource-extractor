name: minglive_resource_extractor
description: >-
  Reconstructs MingLive built-in slice resources for the signed-in member
  account. Ships the locally carried 99% slice heads and stitches them with the
  server-supplied tails, verifying SHA-256 at every stage.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.3
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # The 340 `.part` slice heads plus `catalog.json` live under
  # `assets/builtin-slices/`. Because Flutter requires every asset to be listed
  # explicitly and a directory entry only covers its immediate children, the
  # full manifest is generated into `pubspec_generated_assets.yaml` by
  # `tool/gen_asset_manifest.dart` and merged here at build time by
  # `tool/merge_assets.dart`.
  #
  # When the slices are absent (fresh clone without the archive unpacked) the
  # app still builds and runs; it simply reports zero local slices.
  assets:
    - assets/builtin-slices/catalog.json
    - assets/builtin-slices/effects/audio/bullet_appear.mp3.part
    - assets/builtin-slices/effects/audio/bullet_click.mp3.part
    - assets/builtin-slices/effects/audio/caterpillar_click.mp3.part
    - assets/builtin-slices/effects/audio/caterpillar_fall.mp3.part
    - assets/builtin-slices/effects/audio/chain_fireball.mp3.part
    - assets/builtin-slices/effects/audio/chain_iceball.mp3.part
    - assets/builtin-slices/effects/audio/chain_midway.mp3.part
    - assets/builtin-slices/effects/audio/chop_click.mp3.part
    - assets/builtin-slices/effects/audio/chop_end.mp3.part
    - assets/builtin-slices/effects/audio/chop_start.mp3.part
    - assets/builtin-slices/effects/audio/crash.mp3.part
    - assets/builtin-slices/effects/audio/flashbang.mp3.part
    - assets/builtin-slices/effects/audio/fruit_slice_cut.mp3.part
    - assets/builtin-slices/effects/audio/fruit_slice_end.mp3.part
