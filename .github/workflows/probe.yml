name: Runner matrix probe
on: workflow_dispatch
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-14, macos-13, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: platform
        run: |
          echo "runner: ${{ matrix.os }}"
          uname -a
          sw_vers
          xcodebuild -version
