name: Build unsigned IPA

# NOTE ON RUNNERS
# --------------
# An iOS `.app` bundle can only be produced by Apple's toolchain, so this
# workflow requires a macOS runner. Public/`macos-*` hosted runners are subject
# to the account's macOS minute quota; when that quota is unavailable the job is
# cancelled before any step runs (the run shows `steps: []` and an empty
# runner_name).
#
# `MACOS_RUNNER` lets the build target a self-hosted macOS machine instead:
#   Settings -> Secrets and variables -> Actions -> Variables
#   MACOS_RUNNER = self-hosted   (label of a registered macOS runner)
# Leave it unset to use the hosted `macos-14` image.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter version to build with'
        required: false
        default: '3.24.5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Runner.app and package unsigned IPA
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-14' }}
    timeout-minutes: 120
    env:
      FLUTTER_VERSION: ${{ inputs.flutter_version || '3.24.5' }}
      FLUTTER_CHANNEL: stable
    steps:
      - name: Confirm runner platform
        run: |
          uname -a
          sw_vers || true
          xcodebuild -version || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify LFS payload unpacked
        run: |
          set -euo pipefail
          count=$(find assets/builtin-slices -name '*.part' -type f | wc -l | tr -d ' ')
          echo "slice files: $count"
          if [ "$count" -ne 340 ]; then
            echo "::error::expected 340 slice files, found $count — Git LFS objects were not fetched"
            exit 1
          fi
          # A pointer file is ~130 bytes; a real slice is much larger.
          smallest=$(find assets/builtin-slices -name '*.part' -type f -printf '%s\n' \
            | sort -n | head -n 1)
          echo "smallest slice: ${smallest} bytes"
          if [ "$smallest" -lt 1000 ]; then
            echo "::error::found LFS pointer files instead of payload; run 'git lfs pull'"
            exit 1
          fi
          du -sh assets/builtin-slices

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Regenerate asset manifest
        run: |
          dart tool/gen_asset_manifest.dart
          echo "asset entries: $(grep -c '^    - assets/' pubspec.yaml)"

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS release (no codesign)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tail -n 250

      - name: Verify the app bundle
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP" || { echo "::error::missing $APP"; exit 1; }
          echo "app size: $(du -sh "$APP" | cut -f1)"
          echo "--- executable ---"
          file "$APP/Runner"
          echo "--- slices inside the bundle ---"
          n=$(find "$APP/Frameworks/App.framework/flutter_assets/assets/builtin-slices" \
                -name '*.part' | wc -l | tr -d ' ')
          echo "bundled slices: $n"
          test "$n" -eq 340 || { echo "::error::expected 340 bundled slices, got $n"; exit 1; }
          echo "--- signing status (unsigned is expected) ---"
          codesign -dv "$APP" 2>&1 || echo "unsigned (expected)"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          OUT=build/ipa
          rm -rf "$OUT"; mkdir -p "$OUT/Payload"
          cp -R "$APP" "$OUT/Payload/Runner.app"
          cd "$OUT"
          zip -qry -y MingLiveExtractor-unsigned.ipa Payload
          ls -lh MingLiveExtractor-unsigned.ipa
          shasum -a 256 MingLiveExtractor-unsigned.ipa \
            | tee MingLiveExtractor-unsigned.ipa.sha256

      - name: Validate the IPA payload
        run: |
          set -euo pipefail
          IPA=build/ipa/MingLiveExtractor-unsigned.ipa
          unzip -l "$IPA" | head -n 15
          echo "--- checks ---"
          unzip -l "$IPA" | grep -q 'Payload/Runner.app/Runner' \
            || { echo "::error::Runner binary missing from IPA"; exit 1; }
          n=$(unzip -l "$IPA" | grep -c 'builtin-slices/.*\.part' || true)
          echo "slices in IPA: $n"
          test "$n" -eq 340 || { echo "::error::expected 340 slices in IPA, got $n"; exit 1; }

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MingLiveExtractor-unsigned-ipa
          path: |
            build/ipa/MingLiveExtractor-unsigned.ipa
            build/ipa/MingLiveExtractor-unsigned.ipa.sha256
          retention-days: 30
          compression-level: 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/ios/**/*.log
            ~/Library/Logs/gym/*.log
          retention-days: 7
          if-no-files-found: ignore
