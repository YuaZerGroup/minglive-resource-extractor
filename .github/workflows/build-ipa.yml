name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter version to build with'
        required: false
        default: '3.24.5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: ${{ github.event.inputs.flutter_version || '3.24.5' }}
  FLUTTER_CHANNEL: stable

jobs:
  build:
    name: Build Runner.app and package unsigned IPA
    # The project carries ~364 MiB of slice assets, so the default 3x runner
    # disk is tight. macOS runners ship with an arm64 toolchain that Flutter
    # needs for the iOS 13 deployment target.
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Show workspace size
        run: |
          echo "repo size:"
          du -sh . || true
          echo "slice assets:"
          du -sh assets/builtin-slices || true
          find assets/builtin-slices -type f | wc -l

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Regenerate asset manifest
        # Flutter needs every slice listed individually. The generator rewrites
        # the `assets:` block of pubspec.yaml from whatever is on disk, so a
        # partial checkout still produces a consistent manifest.
        run: |
          dart tool/gen_asset_manifest.dart
          echo "--- asset entry count ---"
          grep -c '^    - assets/' pubspec.yaml

      - name: Verify manifest is committed
        run: |
          if ! git diff --quiet -- pubspec.yaml; then
            echo "::warning::pubspec.yaml asset manifest differed from the committed copy and was regenerated"
            git --no-pager diff --stat -- pubspec.yaml
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          pod --version
          pod install --repo-update

      - name: Build iOS release (no codesign)
        # `--no-codesign` is what makes the output unsigned; there is no
        # certificate or provisioning profile in CI and none is wanted.
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --no-tree-shake-icons \
            --verbose 2>&1 | tail -n 200

      - name: Verify the built app bundle
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP" || { echo "missing $APP"; exit 1; }
          echo "app size: $(du -sh "$APP" | cut -f1)"
          echo "--- bundle layout ---"
          ls -la "$APP" | head -n 40
          echo "--- flutter assets ---"
          du -sh "$APP/Frameworks/App.framework/flutter_assets" || true
          echo "--- slice count inside the bundle ---"
          find "$APP/Frameworks/App.framework/flutter_assets/assets/builtin-slices" \
            -name '*.part' | wc -l || echo "0"
          echo "--- codesign status (expect: not signed) ---"
          codesign -dv "$APP" 2>&1 || echo "unsigned (expected)"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          OUT=build/ipa
          rm -rf "$OUT"; mkdir -p "$OUT/Payload"
          cp -R "$APP" "$OUT/Payload/Runner.app"
          cd "$OUT"
          # 7z keeps very large members more reliably than `zip` on the runner,
          # and it is preinstalled on macOS images.
          zip -qry -y MingLiveExtractor-unsigned.ipa Payload
          ls -lh MingLiveExtractor-unsigned.ipa
          shasum -a 256 MingLiveExtractor-unsigned.ipa \
            | tee MingLiveExtractor-unsigned.ipa.sha256

      - name: Validate the IPA payload
        run: |
          set -euo pipefail
          IPA=build/ipa/MingLiveExtractor-unsigned.ipa
          echo "--- archive listing (first 20) ---"
          unzip -l "$IPA" | head -n 20
          echo "--- entry count ---"
          unzip -l "$IPA" | tail -n 1
          echo "--- confirm the embedded binary exists ---"
          unzip -l "$IPA" | grep -c 'Payload/Runner.app/Runner' || exit 1
          echo "--- confirm slices are inside ---"
          unzip -l "$IPA" | grep -c 'builtin-slices/.*\.part' || exit 1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MingLiveExtractor-unsigned-ipa
          path: |
            build/ipa/MingLiveExtractor-unsigned.ipa
            build/ipa/MingLiveExtractor-unsigned.ipa.sha256
          retention-days: 30
          compression-level: 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/ios/**/*.log
            ~/Library/Logs/gym/*.log
          retention-days: 7
          if-no-files-found: ignore
